<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMEG</title>

    <link rel="stylesheet" href="./styles/variables.css">
    <link rel="stylesheet" href="./styles/base.css">
    <link rel="stylesheet" href="./styles/components.css">
    <link rel="stylesheet" href="./styles/responsive.css">
</head>
<body>
    <header class="site-header" id="inicio">
        <div class="container">
            <!-- Navegação será implementada no CSS/HTML -->
        </div>
    </header>

    <main>
        <section class="hero" id="hero">
            <div class="container">
                <!-- Hero e CTA -->
            </div>
        </section>

        <section class="about" id="quem-somos">
            <div class="container">
                <!-- Quem somos -->
            </div>
        </section>

        <section class="clients" id="clientes">
            <div class="container">
                <!-- Clientes e carrossel -->
            </div>
        </section>

        <section class="company-numbers" id="numeros">
            <div class="container">
                <!-- Indicadores da empresa -->
            </div>
        </section>

        <section class="services" id="servicos">
            <div class="container">
                <!-- Serviços oferecidos -->
            </div>
        </section>

        <section class="workflow" id="como-trabalhamos">
            <div class="container">
                <!-- Como trabalhamos -->
            </div>
        </section>

        <section class="location" id="localizacao">
            <div class="container">
                <!-- Área reservada para o mapa/iframe do Google -->
            </div>
        </section>

        <section class="contact" id="contato">
            <div class="container">
                <!-- Informações e ações de contato -->
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container">
            <!-- Endereço e informações institucionais -->
        </div>
    </footer>

    <script src="./scripts/main.js" defer></script>
</body>
</html>
